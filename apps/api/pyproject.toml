[project]
name = "api"
version = "0.1.0"
description = "FastAPI backend for Vision Query"
dependencies = [
    "fastapi>=0.111.0",
    "pydantic-settings>=2.3.0",
    "uvicorn>=0.30.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
