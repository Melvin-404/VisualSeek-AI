# ============================================
# VisualSeek AI - Combined Docker Compose
# ============================================
# Usage:
#   docker compose up --build -d     (start combined app)
#   docker compose down              (stop combined app)
#   docker compose logs -f           (view logs)
# ============================================

name: visualseek-ai

services:
  app:
    build:
      context: .
      dockerfile: ./Dockerfile
    container_name: visualseek-app
    ports:
      - "3000:3000"
      - "8000:8000"
    environment:
      # Access host-provided database and redis
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@host.docker.internal:5435/postgres
      - REDIS_URL=redis://host.docker.internal:6379/0
      - ENCRYPTION_KEY=ba58mDwB9gULkdH9B7Ljy79q_0dLuRdSEdcYrtRe2p8=
      - API_ENV=development
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - HF_HUB_DISABLE_SYMLINKS_WARNING=1
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
      - JWT_SECRET_KEY=supersecretjwtkeyforvisualseekbackendapiwhichshouldbechangedinprod
      - JWT_ALGORITHM=HS256
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
