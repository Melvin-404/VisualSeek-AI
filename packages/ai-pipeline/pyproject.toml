[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Python ML pipeline package with GPU support"
dependencies = [
    "torch>=2.2.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
