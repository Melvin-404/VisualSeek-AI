[project]
name = "ai-pipeline"
version = "0.1.0"
description = "Python ML pipeline package with GPU support"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.20.1",
    "pymilvus>=2.4.0",
    "opencv-python-headless>=4.10.0",
    "celery[redis]>=5.4.0",
    "minio>=7.2.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.0.0",
    "ffmpeg-python>=0.2.0",
    "psycopg2-binary>=2.9.0",
    "SQLAlchemy>=2.0.0",
    "av>=12.0.0",
    "imagehash>=4.3.0",
    "ultralytics>=8.2.0",
    "pynvml>=11.5.0",
    "scipy>=1.12.0",
    "shapely>=2.0.0",
    "open-clip-torch>=2.24.0",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"
